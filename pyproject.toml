[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omni-agent"
version = "0.1.0"
description = "A small, bounded, tool-using general-purpose AI agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
omni-agent = "omni_agent.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["omni_agent*"]
